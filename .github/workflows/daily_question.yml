name: Q365 Daily Question Generator

on:
  schedule:
    # يشتغل تلقائياً كل يوم الساعة 12 بالليل بتوقيت ليبيا (22:00 UTC)
    - cron: '0 22 * * *'
  workflow_dispatch: # زر لتشغيل الأتمتة يدوياً للتجربة في أي وقت

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq supabase

      - name: Run daily question script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python Q365.py
